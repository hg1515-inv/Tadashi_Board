<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>掲示板</title>
  <link rel="stylesheet" href="/css/board.css">
</head>
<body>
  <!-- 表示モード用（admin 時は JS で body クラス差し替え＋管理 DOM を表示） -->
  <div id="viewer-shell">
    <div id="board" aria-live="polite">読み込み中…</div>
    <div id="loop-indicator"></div>
    <div id="status">接続中…</div>
  </div>

  <div id="admin-shell" hidden>
    <h1>掲示板・管理画面</h1>
    <p class="hint">文字と写真を送信できます。DB には<strong>最新 3 件だけ</strong>残り、表示画面では 3 件を自動ループします。</p>

    <div id="config-warn" class="config-warn" hidden>
      Supabase が未設定です。<code>public/js/config.js</code> に URL と anon key を設定するか、Render のビルド環境変数を設定してください。
    </div>

    <div class="section">
      <label for="msg">メッセージ（文字）</label>
      <textarea id="msg" maxlength="2000" placeholder="例：これ買ってきたよ！"></textarea>

      <label for="imageInput" style="margin-top: 1rem;">写真</label>
      <input type="file" id="imageInput" accept="image/*">

      <button type="button" id="send">送信する</button>
    </div>

    <button type="button" id="clear" class="secondary">表示をクリア（全投稿削除）</button>
    <div id="toast" role="status"></div>

    <p style="margin-top:1.5rem;font-size:0.85rem;color:#666;">
      <a href="/">← 表示画面を開く</a>
    </p>

    <p style="font-size:0.85rem;color:#888;margin-top:0.5rem;">現在保持されている投稿（最大 3 件）</p>
    <div id="preview-list"></div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.49.1/dist/umd/supabase.min.js"></script>
  <script src="/js/config.js"></script>
  <script src="/js/app.js"></script>
  <script>
    (function () {
      var admin = new URLSearchParams(location.search).get('mode') === 'admin';
      document.getElementById('viewer-shell').hidden = admin;
      document.getElementById('admin-shell').hidden = !admin;
      if (admin) {
        document.getElementById('board').removeAttribute('aria-live');
      }
    })();
  </script>
</body>
</html>
